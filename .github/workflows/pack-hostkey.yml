name: Pack sites for Hostkey

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/pack-hostkey.yml"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Trust Timeweb
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 188.225.45.211 >> ~/.ssh/known_hosts

    - name: Copy from Timeweb and pack
      run: |
        set -e
        mkdir -p /tmp/pack
        rsync -az root@188.225.45.211:/var/www/waldau/ /tmp/pack/waldau/
        rsync -az root@188.225.45.211:/var/www/izotoff/ /tmp/pack/izotoff/
        scp -q root@188.225.45.211:/etc/waldau.env /tmp/pack/waldau.env
        scp -q root@188.225.45.211:/etc/izotoff.env /tmp/pack/izotoff.env
        tar -C /tmp/pack -czf /tmp/sites.tgz waldau izotoff waldau.env izotoff.env
        ls -lh /tmp/sites.tgz

    - name: Publish temporary GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        gh release delete hostkey-migrate --yes --repo Befivee/Izotoff || true
        gh release create hostkey-migrate /tmp/sites.tgz \
          --repo Befivee/Izotoff \
          --title "Temporary Hostkey migrate pack" \
          --notes "Удалить после переноса. Не держать публично." \
          --prerelease
        echo "RELEASE=https://github.com/Befivee/Izotoff/releases/download/hostkey-migrate/sites.tgz"

    - name: Keep artifact too
      uses: actions/upload-artifact@v4
      with:
        name: sites-tgz
        path: /tmp/sites.tgz
        retention-days: 2
